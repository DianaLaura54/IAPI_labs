version: "3.8"
services:
  influxdb:
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin12345
      - DOCKER_INFLUXDB_INIT_ORG=lab-org
      - DOCKER_INFLUXDB_INIT_BUCKET=pump_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=lab-token-123
    volumes:
      - ./influx-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
